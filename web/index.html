<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grapnl</title>
    <!-- 共有されたときに何のゲームか分かるよう、サイトのゲームページと同じ説明・画像・アイコンを付ける。
         共有の行き先は、説明と今日のランキングがあるサイトのゲームページにする（canonical と og:url）。 -->
    <meta name="description" content="日替わりのコースを走り、同じコースを走った人と自己ベストを競う。">
    <link rel="canonical" href="https://roommate.hayashi-naoki.com/games/grapnl/">
    <link rel="icon" href="https://roommate.hayashi-naoki.com/favicon.ico" sizes="32x32">
    <link rel="icon" href="https://roommate.hayashi-naoki.com/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://roommate.hayashi-naoki.com/apple-touch-icon.png">
    <meta property="og:site_name" content="roommate">
    <meta property="og:title" content="grapnl">
    <meta property="og:description" content="日替わりのコースを走り、同じコースを走った人と自己ベストを競う。">
    <meta property="og:url" content="https://roommate.hayashi-naoki.com/games/grapnl/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image" content="https://roommate.hayashi-naoki.com/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="roommate のロゴ">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        #delete-dialog {
            box-sizing: border-box;
            width: min(28rem, calc(100vw - 32px));
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
            padding: 20px;
            background: rgb(24, 27, 34);
            color: rgb(190, 198, 210);
            border: 1px solid rgb(60, 66, 80);
            border-radius: 8px;
            font: 14px/1.6 sans-serif;
        }

        #delete-dialog:modal {
            overscroll-behavior: contain;
        }

        #delete-dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
            overflow: hidden;
            overscroll-behavior: contain;
        }

        #delete-title {
            margin: 0 0 12px;
            font-size: 18px;
            color: white;
        }

        #delete-dialog[data-state="failed"] #delete-title {
            color: rgb(255, 140, 128);
        }

        #delete-dialog p {
            margin: 0 0 6px;
        }

        #delete-dialog form {
            margin: 16px 0 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 12px;
        }

        #delete-dialog button {
            padding: 6px 16px;
            font-size: 15px;
        }

        #delete-dialog .danger {
            color: rgb(255, 140, 128);
        }

        #delete-dialog button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* WASM の取得とコンパイルが終わるまでキャンバスは真っ黒。
           その間は、読み込み中だと分かる文字を出す。 */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 1;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            color: rgb(180, 190, 205);
            font-family: sans-serif;
            font-size: 28px;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }

        #loading-dots span {
            opacity: 0;
            animation: loading-dot 1.2s infinite;
        }

        #loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        #loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loading-dot {
            0%,
            20% { opacity: 0; }
            50%,
            100% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            #loading-dots span {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <!-- id="glcanvas" は macroquad の JS ローダーが必須としている名前。
         ローダーは window.onresize で clientWidth / clientHeight を読み、
         描画バッファをブラウザの表示サイズに合わせる。 -->
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- 確認・消している間・結果を、data-state で出し分ける。 -->
    <dialog id="delete-dialog" aria-labelledby="delete-title" data-state="confirm">
        <!-- 消している間と結果は、見出しを書き換えて伝える。 -->
        <h2 id="delete-title" aria-live="polite">Delete your data?</h2>
        <div data-for="confirm">
            <p>Your anonymous ID and all your scores in every roommate game will be deleted. This can't be undone.</p>
        </div>
        <div data-for="done">
            <p>Reloading...</p>
        </div>
        <div data-for="failed">
            <p>Check your connection and try again.</p>
        </div>
        <form method="dialog">
            <!-- 取り消せない操作なので、最初は「やめる」にフォーカスを置く。 -->
            <button type="button" class="danger" data-for="confirm failed" data-action="delete"></button>
            <button value="close" data-for="confirm failed" data-autofocus>Cancel</button>
        </form>
    </dialog>
    <p id="loading" role="status">Loading<span id="loading-dots"><span>.</span><span>.</span><span>.</span></span></p>
    <!-- wasm-bindgen ではなく macroquad 専用ローダー。
         出典: macroquad 0.4.16 の js/mq_js_bundle.js
         https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <!-- バンドル末尾の quad_net が strict mode で未宣言の register_plugin へ代入する。
         先にグローバルを置かないと、その代入が例外になりプラグイン登録が途中で止まる。 -->
    <script>var register_plugin;</script>
    <script src="mq_js_bundle.js"></script>
    <script>
        // 自己ベストと送れなかったスコアの置き場所は slug で分かれる。
        // 以前は browser-game-1.high-score、その後 roommate.*.browser-game-1。
        // slug が grapnl になったので、roommate-sdk が読む grapnl の置き場所へ移す。
        // roommate-sdk は起動時にこれを読むので、roommate-sdk.js より前に置く。
        try {
            var legacyBest = Number(localStorage.getItem("browser-game-1.high-score"));
            var oldBest = Number(localStorage.getItem("roommate.best.browser-game-1"));
            var newBest = Number(localStorage.getItem("roommate.best.grapnl"));
            var movedBest = 0;
            if (Number.isSafeInteger(legacyBest) && legacyBest > movedBest) movedBest = legacyBest;
            if (Number.isSafeInteger(oldBest) && oldBest > movedBest) movedBest = oldBest;
            if (movedBest > 0 && !(newBest >= movedBest)) {
                localStorage.setItem("roommate.best.grapnl", String(movedBest));
            }
            localStorage.removeItem("browser-game-1.high-score");
            localStorage.removeItem("roommate.best.browser-game-1");

            var readPending = function (key) {
                try {
                    var value = JSON.parse(localStorage.getItem(key) || "[]");
                    return Array.isArray(value) ? value : [];
                } catch (e) {
                    return [];
                }
            };
            var oldPending = readPending("roommate.pending.browser-game-1");
            if (oldPending.length > 0) {
                // roommate-sdk は新しいほうから最大 20 件だけ残す。
                var pending = oldPending.concat(readPending("roommate.pending.grapnl")).slice(-20);
                localStorage.setItem("roommate.pending.grapnl", JSON.stringify(pending));
            }
            localStorage.removeItem("roommate.pending.browser-game-1");
        } catch (e) {
            // localStorage が使えなくても遊べる。
        }
    </script>
    <!-- 匿名 ID・スコア・自己ベスト（roommate-sdk）。load() より前に読み込む。 -->
    <script src="roommate-sdk.js" data-game="grapnl"></script>
    <!-- 同時に遊んでいる人の影。load() より前に読み込む。 -->
    <script src="realtime.js"></script>
    <script>
        // タブを離れたこととフォーカスが外れたことを覚えておき、wasm が毎フレーム読んで一時停止する（src/page.rs）。
        // タブが裏にある間はフレームが回らないので、戻ってきた最初のフレームで読めるよう、起きたことを残しておく。
        (function () {
            var lost = false;
            var deleteDialog = document.getElementById("delete-dialog");
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) lost = true;
            });
            window.addEventListener("blur", function () {
                lost = true;
            });
            function register_plugin(importObject) {
                importObject.env.page_lost_focus = function () {
                    // データを消すダイアログと、名前の入力欄（roommate-sdk が出す）を開いている間も止めておく。
                    var nameDialogOpen = window.roommate && window.roommate.isNameDialogOpen();
                    var result = lost || document.hidden || (deleteDialog && deleteDialog.open) || nameDialogOpen;
                    lost = false;
                    return result ? 1 : 0;
                };
                // 端末に覚えておく設定（src/page.rs）。キーは grapnl. を付けて置き、0 以上の整数だけを扱う。
                // 無いときや localStorage が使えないときは -1 を返す。
                function key(ptr, len) {
                    return "grapnl." + new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len));
                }
                importObject.env.page_storage_read = function (ptr, len) {
                    try {
                        var raw = localStorage.getItem(key(ptr, len));
                        var value = Number(raw);
                        return raw !== null && Number.isSafeInteger(value) && value >= 0 && value <= 2147483647 ? value : -1;
                    } catch (e) {
                        return -1;
                    }
                };
                // 一時停止の画面のボタンから呼ぶ。ページの上のヘッダーにあった操作。
                importObject.env.page_open_delete_dialog = function () {
                    if (window.grapnlOpenDeleteDialog) window.grapnlOpenDeleteDialog();
                };
                importObject.env.page_go_to_site = function () {
                    window.location.href = "https://roommate.hayashi-naoki.com/games/grapnl/";
                };
                importObject.env.page_storage_write = function (ptr, len, value) {
                    try {
                        localStorage.setItem(key(ptr, len), String(value));
                    } catch (e) {
                        // 覚えられなくても遊べる。
                    }
                };
            }
            miniquad_add_plugin({ register_plugin: register_plugin, name: "grapnl_page", version: 1 });
        })();

        // 一時停止の画面の「Delete my data」（page_open_delete_dialog）。確認してから roommate-sdk で消し、結果を出す。
        // ダイアログはモーダルなので、開いている間はキャンバスにクリックもキーも届かない。
        // ゲームは上の page_lost_focus で一時停止し、閉じた後に Esc かクリックで再開する。
        (function () {
            var client = window.roommate && window.roommate.client;
            var canvas = document.getElementById("glcanvas");
            var dialog = document.getElementById("delete-dialog");
            var title = document.getElementById("delete-title");
            if (!client || !dialog) return;
            var TITLES = {
                confirm: "Delete your data?",
                deleting: "Deleting...",
                done: "Your data was deleted",
                failed: "Couldn't delete your data",
            };

            function show(state) {
                dialog.dataset.state = state;
                title.textContent = TITLES[state];
                var parts = dialog.querySelectorAll("[data-for]");
                for (var i = 0; i < parts.length; i++) {
                    parts[i].hidden = parts[i].dataset.for.split(" ").indexOf(state) < 0;
                }
                var deleteButton = dialog.querySelector('[data-action="delete"]');
                deleteButton.textContent = state === "failed" ? "Try again" : "Delete";
            }

            // 消し終えたら、消したことを少し見せてからページを開き直す。開き直すと新しい匿名 ID で始まる。
            function reloadSoon() {
                setTimeout(function () {
                    window.location.reload();
                }, 1200);
            }

            window.grapnlOpenDeleteDialog = function () {
                if (dialog.open) return;
                show("confirm");
                dialog.showModal();
                dialog.querySelector("[data-autofocus]").focus();
            };

            dialog.querySelector('[data-action="delete"]').addEventListener("click", function () {
                show("deleting");
                client.requestDelete().then(function () {
                    var state = client.deleteState() === "done" ? "done" : "failed";
                    if (dialog.open) show(state);
                    if (state === "done") reloadSoon();
                });
            });

            // 消している間に閉じても、消すのは続き、消し終えたらページを開き直す。
            dialog.addEventListener("close", function () {
                // 閉じた後のキー入力がゲームに届くよう、フォーカスをキャンバスへ戻す。
                canvas.focus();
            });
        })();

        // ゲームの最初のフレームは gl.clear で画面を塗り始める。
        // clear の時点ではそのフレームの残りをまだ描いているので、
        // 描き終わってから、画面に出る前に読み込み表示を消す。
        (function () {
            var canvas = document.getElementById("glcanvas");
            var loading = document.getElementById("loading");
            if (!canvas || !loading) return;
            var proto = HTMLCanvasElement.prototype;
            var getContext = proto.getContext;
            proto.getContext = function (type) {
                var gl = getContext.apply(this, arguments);
                if (this !== canvas || !gl) return gl;
                if (type !== "webgl" && type !== "webgl2" && type !== "experimental-webgl") return gl;
                proto.getContext = getContext;
                var clear = gl.clear;
                gl.clear = function (mask) {
                    gl.clear = clear;
                    clear.call(gl, mask);
                    queueMicrotask(function () {
                        if (loading.parentNode) loading.remove();
                    });
                };
                return gl;
            };
        })();

        load("grapnl.wasm");
    </script>
</body>
</html>
