name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 各コミットのメッセージが書き方に合うかを確かめる（scripts/check-commit-msg.sh）。
  # フックを入れていないクローンや --no-verify のコミットもここで見つける。
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 範囲の手前のコミットまで要る。
          fetch-depth: 0

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from=$PR_BASE to=$PR_HEAD
          elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # ブランチを作った push や force push は範囲が取れないので、最新のコミットだけを見る。
            from=$AFTER~1 to=$AFTER
          else
            from=$BEFORE to=$AFTER
          fi
          for c in $(git rev-list --no-merges "$from..$to"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || { echo "↑ $c"; exit 1; }
          done

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # macroquad のネイティブビルドに要るライブラリ（README の「必要なもの」と同じ）
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload web
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          install -m 644 target/wasm32-unknown-unknown/release/grapnl.wasm web/grapnl.wasm
          scripts/stage-web.sh dist "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web
          path: dist/
          retention-days: 7

  # main への push で、R2 の roommate-games/grapnl/ に上書きで置く。
  # 配信は roommate の apps/play。戻すときは前のコミットに戻して push し直す。
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # 古い push のアップロードが新しい push の後に終わらないよう、順に 1 つずつ置く。
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/

      # R2 の S3 互換 API で置く。トークンはバケット roommate-games だけに書き込める R2 の API トークン。
      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 は AWS CLI が既定で付けるチェックサムの一部に対応していないので、要るときだけにする。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: scripts/upload-r2.sh dist
