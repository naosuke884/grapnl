[package]
name = "grapnl"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser 2D action game (Rust + macroquad)"

[dependencies]
# 効果音を鳴らすため audio を有効にする（macroquad 0.4 では既定で無効）。
macroquad = { version = "0.4", features = ["audio"] }
# 同梱フォントに入っている文字を読む。macroquad が使う fontdue と同じ版にし、二重にビルドしない。
ttf-parser = "0.25"
# roommate の匿名 ID・スコア・自己ベスト。web/roommate-sdk.js は同じタグのものを置く。
roommate-sdk = { git = "https://github.com/naosuke884/roommate", tag = "roommate-sdk-v0.3.0" }

# 公開用 WASM は初回ロードを軽くするため、release はサイズ優先にする。
# 開発中の `cargo run` は debug プロファイルなので、この設定の影響を受けない。
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# macroquad 推奨。依存クレートだけ最適化し、ゲーム側の再コンパイルは速いままにする。
[profile.dev.package."*"]
opt-level = 3
