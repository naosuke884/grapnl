# 依存の更新 PR を Dependabot に作らせる。minor / patch は 1 本の PR にまとめ、major は個別に確認する
# (Cargo は dev / prod の依存を分けて束ねられないので、束は 1 つにする)
# cooldown はリリースから 7 日経った版だけを提案させ、出たばかりの不具合版や乗っ取られたパッケージを避ける (セキュリティアップデートにはかからない)
# commit-message の prefix は、初期設定の `Bump x from …` では Conventional Commits の形にならないため
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
